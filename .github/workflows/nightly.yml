# Agent-free heavy calibration. PR CI stays on fake-engine smoke; this workflow
# carries Lozza N~100 metrics (and optional on-demand Stockfish) without burning
# Cursor agent time. See docs/testing_strategy.md §7.
name: Nightly calibration

on:
  schedule:
    # 06:15 UTC — offset from the hour to reduce shared-runner contention.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      engine:
        description: >
          Engine for this run. Cron always uses Lozza. Choose stockfish only with
          an explicit match budget (production depth is >251 s per match).
        type: choice
        options:
          - lozza
          - stockfish
        default: lozza
      matches:
        description: Matches per Lozza leader run (ignored when engine=stockfish).
        type: string
        default: '100'
      stockfish_matches:
        description: Matches when engine=stockfish (keep small; explicit budget).
        type: string
        default: '1'
      run_sweep:
        description: Run a one-knob Lozza coefficient sweep (skipped for stockfish).
        type: boolean
        default: true
      vitest_target:
        description: Heavy Vitest target to run on demand.
        type: choice
        options:
          - trajectory
          - sweep
          - chess-fuzz
          - all
        default: trajectory
      campaign_matches:
        description: Trajectory campaign length (all, 16, or 52).
        type: choice
        options:
          - all
          - '16'
          - '52'
        default: all
      run_vitest:
        description: Run the selected heavy Vitest target.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lozza-calibration:
    name: Lozza calibration + sweep
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.engine == 'lozza')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve run configuration
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MATCHES: ${{ inputs.matches }}
          INPUT_RUN_SWEEP: ${{ inputs.run_sweep }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$INPUT_MATCHES" ]; then
            MATCHES="$INPUT_MATCHES"
          else
            MATCHES='100'
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$INPUT_RUN_SWEEP" ]; then
            RUN_SWEEP="$INPUT_RUN_SWEEP"
          else
            RUN_SWEEP='true'
          fi
          echo "matches=${MATCHES}" >> "$GITHUB_OUTPUT"
          echo "run_sweep=${RUN_SWEEP}" >> "$GITHUB_OUTPUT"

      - name: Tyrannical Lozza campaign
        env:
          MATCHES: ${{ steps.cfg.outputs.matches }}
        run: |
          mkdir -p artifacts/nightly
          pnpm --silent sim \
            --matches="$MATCHES" \
            --leader=tyrannical \
            --engine=lozza \
            --depth-cap=4 \
            --seed=1 \
            --enforce-calibration=false \
            --out=artifacts/nightly/tyrannical.csv \
            --artifact-out=artifacts/nightly/tyrannical.metrics.json

      - name: Supportive Lozza campaign
        env:
          MATCHES: ${{ steps.cfg.outputs.matches }}
        run: |
          pnpm --silent sim \
            --matches="$MATCHES" \
            --leader=supportive \
            --engine=lozza \
            --depth-cap=4 \
            --seed=1 \
            --enforce-calibration=false \
            --out=artifacts/nightly/supportive.csv \
            --artifact-out=artifacts/nightly/supportive.metrics.json

      - name: Coefficient sweep (OUTCOME_TRUST_LOSS_SCALE)
        if: steps.cfg.outputs.run_sweep == 'true'
        run: |
          pnpm --silent sim:sweep \
            --knob=OUTCOME_TRUST_LOSS_SCALE \
            --values=6,12,18 \
            --matches=4 \
            --seed=7 \
            --engine=lozza \
            --depth-cap=4 \
            --leader=tyrannical \
            | tee artifacts/nightly/sweep-outcome-trust-loss.csv

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-lozza-metrics
          path: artifacts/nightly/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce tyrannical calibration bounds
        if: always()
        run: |
          pnpm sim:aggregate \
            --inputs=artifacts/nightly/tyrannical.metrics.json \
            --enforce-calibration=true

      - name: Enforce supportive calibration bounds
        if: always()
        run: |
          pnpm sim:aggregate \
            --inputs=artifacts/nightly/supportive.metrics.json \
            --enforce-calibration=true

  vitest-heavy:
    name: Heavy Vitest balance tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_vitest == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run selected heavy Vitest target
        env:
          VITEST_TARGET: ${{ inputs.vitest_target }}
          CAMPAIGN_MATCHES: ${{ inputs.campaign_matches }}
        run: |
          case "$VITEST_TARGET" in
            trajectory)
              HEAVY_CAMPAIGN_MATCHES="$CAMPAIGN_MATCHES" \
                pnpm exec vitest run tests/sim.trajectory.test.ts
              ;;
            sweep)
              pnpm exec vitest run tests/sim.sweep.test.ts
              ;;
            chess-fuzz)
              pnpm exec vitest run tests/chess.board.fuzz.test.ts
              ;;
            all)
              HEAVY_CAMPAIGN_MATCHES="$CAMPAIGN_MATCHES" pnpm test:heavy
              ;;
            *)
              echo "Unknown heavy Vitest target: $VITEST_TARGET" >&2
              exit 1
              ;;
          esac

  stockfish-spot:
    name: Stockfish spot check (dispatch only)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.engine == 'stockfish'
    runs-on: ubuntu-latest
    # Production-depth Stockfish was measured at >251 s per match.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Stockfish budgeted run
        env:
          MATCHES: ${{ inputs.stockfish_matches }}
        run: |
          mkdir -p artifacts/nightly
          echo "Stockfish budget: ${MATCHES} match(es) at uncapped production depth."
          pnpm --silent sim \
            --matches="${MATCHES}" \
            --leader=tyrannical \
            --engine=stockfish \
            --seed=1 \
            --out=artifacts/nightly/stockfish-tyrannical.csv

      - name: Upload Stockfish metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-stockfish-metrics
          path: artifacts/nightly/
          if-no-files-found: error
          retention-days: 30
