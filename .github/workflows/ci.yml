name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Required planning docs present
        run: |
          for f in AGENTS.md README.md CONTRIBUTING.md LICENSING.md \
                   docs/architecture.md docs/development_plan.md \
                   docs/design_decisions.md docs/psychology_engine.md docs/data_model.md \
                   docs/trust_dynamics.md docs/desertion_model.md \
                   docs/credence_model.md docs/belief_model.md \
                   docs/engine_licensing.md \
                   docs/testing_strategy.md docs/llm_integration.md \
                   docs/risks_and_open_questions.md docs/spec/living-chess-srs.md \
                   docs/spec/psychology-engine.reference.ts; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Skills have frontmatter
        run: |
          for f in .agents/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "$f missing frontmatter"; exit 1; }
            grep -q '^name:' "$f" || { echo "$f missing name:"; exit 1; }
            grep -q '^description:' "$f" || { echo "$f missing description:"; exit 1; }
          done

  app:
    name: Lint / typecheck / build / test / sim smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
      - run: pnpm sim --matches=20 --leader=tyrannical --engine=fake

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: app
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
