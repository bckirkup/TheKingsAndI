name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pushes on the same ref stop paying for a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Required planning docs present
        run: |
          for f in AGENTS.md README.md CONTRIBUTING.md LICENSING.md \
                   docs/architecture.md docs/development_plan.md \
                   docs/design_decisions.md docs/psychology_engine.md docs/data_model.md \
                   docs/trust_dynamics.md docs/desertion_model.md \
                   docs/credence_model.md docs/belief_model.md \
                   docs/engine_licensing.md \
                   docs/testing_strategy.md docs/llm_integration.md \
                   docs/risks_and_open_questions.md docs/spec/living-chess-srs.md \
                   docs/spec/psychology-engine.reference.ts; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Skills have frontmatter
        run: |
          for f in .agents/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "$f missing frontmatter"; exit 1; }
            grep -q '^name:' "$f" || { echo "$f missing name:"; exit 1; }
            grep -q '^description:' "$f" || { echo "$f missing description:"; exit 1; }
          done

  app:
    name: Lint / typecheck / build / fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  sim-smoke:
    # Runs beside `app` rather than after it: the smoke is the second-longest
    # step in the gate, so serializing it doubles the wall clock for nothing.
    # 6 matches keeps this inside the <3 min budget in
    # docs/testing_strategy.md §1; nightly runs the 20-match, two-leader form.
    name: Headless sim smoke (fake engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm sim --matches=6 --leader=tyrannical --engine=fake

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: app
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-lcov
          path: coverage
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
